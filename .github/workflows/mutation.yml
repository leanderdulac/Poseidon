name: mutation

# Mutação completa é lenta — só sob demanda.
on:
  workflow_dispatch:

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Mutmut (caminhos críticos)
        run: |
          mkdir -p reports
          mutmut run 2>&1 | tee reports/mutmut.txt || true
          mutmut results 2>&1 | tee -a reports/mutmut.txt || true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-report
          path: reports/
          if-no-files-found: ignore
