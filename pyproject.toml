[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poseidon"
version = "0.1.0"
description = "CCO hidráulico Poseidon — dinâmica dos fluidos para produção de água CEDAE"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Leandro França de Mello" }]
keywords = ["hidraulica", "CEDAE", "fluids", "geosmina", "CCO"]
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "radon>=6.0",
    "xenon>=0.9",
    "mutmut>=2.4",
    "bandit>=1.7",
    "types-requests>=2.32",
]
scipy = ["scipy>=1.11"]
torch = ["torch"]

[project.scripts]
poseidon = "poseidon.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["poseidon"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
# Baseline medido 2026-09-07: TOTAL 91.78% (791 stmts, 65 miss).
# Floor 90 = ligeiramente abaixo do atual (não fabricado).
fail_under = 90
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
# Análise: 3.12+ necessário p/ stubs numpy atuais (type aliases).
# Runtime do projeto continua requires-python >=3.11.
python_version = "3.12"
packages = ["poseidon"]
mypy_path = "src"
warn_unused_ignores = true
warn_return_any = false
warn_unreachable = true
check_untyped_defs = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
# Tipagem gradual: módulos críticos endurecem ao longo do tempo.

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["poseidon.hydraulics", "poseidon.quality", "poseidon.alf"]
disallow_untyped_defs = false

[tool.xenon]
max_absolute = "B"
max_modules = "A"
max_average = "A"

[tool.mutmut]
# Caminhos críticos apenas — mutação completa é lenta.
source_paths = ["src/poseidon"]
only_mutate = [
    "src/poseidon/hydraulics.py",
    "src/poseidon/quality.py",
    "src/poseidon/alf.py",
    "src/poseidon/benchmarks.py",
]
pytest_add_cli_args = ["-q", "--tb=no"]
